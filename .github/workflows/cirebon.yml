name: Scrape TMA Cirebon

on:
  schedule:
    # Menit ke-7 tiap jam (UTC, tapi karena tiap jam jadi sama saja di WIB).
    # Jendela data skrip: jam bulat +-5 menit, jadi harus jalan SETELAH menit :05.
   
  workflow_dispatch:   # tombol "Run workflow" manual untuk testing

permissions:
  contents: write      # supaya bisa commit CSV

concurrency:
  group: scrape-cirebon
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Jalankan scraper Cirebon
        run: python scraper_cirebon.py

      - name: Commit & push jika ada data baru
        run: |
          FILE="data/cirebon/history_pushidrosal_cirebon.csv"
          [ -f "$FILE" ] || { echo "CSV belum ada, skip."; exit 0; }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FILE"

          if git diff --cached --quiet; then
            echo "Tidak ada perubahan, skip commit."
            exit 0
          fi

          git commit -m "Update TMA Cirebon $(TZ=Asia/Jakarta date +'%Y-%m-%d %H:%M') WIB"

          # Workflow Priok mungkin push di waktu yang sama -> rebase lalu coba lagi
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            echo "Push gagal (percobaan $i), coba lagi..."
            sleep 5
          done
          exit 1
